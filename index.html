<!DOCTYPE html>
<html lang="vi">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>English Hub — Học tiếng Anh từ số 0 đến nâng cao</title>

<div class="layout">

  <!-- ============ RAIL ============ -->

      </a>
      <button id="closeMenu" class="icon-btn only-mobile" aria-label="Đóng">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="rail-scroll">
      <div class="rail-label">Học tập</div>
      <nav class="nav-main">
        <a href="#/home" class="nav-item" data-route="home">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>

        <a href="#/vocab" class="nav-item" data-route="vocab">

        <a href="#/grammar" class="nav-item" data-route="grammar">
          <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h13"/></svg>

        <a href="#/flashcards" class="nav-item" data-route="flashcards">

        <a href="#/exam" class="nav-item" data-route="exam">
          <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 13l2 2 4-4"/></svg>

      <div class="rail-label">Các buổi học</div>
      <div id="lessonNav" class="lesson-nav"></div>

      <div class="rail-label">Khác</div>
      <nav class="nav-main">
        <a href="#/docs" class="nav-item" data-route="docs">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Bộ tài liệu</a>
        <a href="#/doc/00-huong-dan-hoc.md" class="nav-item" data-route="doc">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.4v.4"/><circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/></svg>
          Hướng dẫn học</a>
      </nav>
    </div>

    <div class="rail-bottom">
      <div class="progress-box">
        <div class="progress-label"><span>Tiến độ</span><b id="progressPct">0%</b></div>
        <div class="progress-bar"><div id="progressFill"></div></div>
        <button id="resetProgress" class="link-btn">Xoá tiến độ</button>
      </div>
      <a class="rail-cta" id="railCta" href="#/lesson/a1-01">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span>Bắt đầu Buổi 1</span>
      </a>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn only-mobile" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <a href="#/home" class="topbar-brand only-mobile"><span class="logo sm">EH</span></a>

      <div class="search-wrap">
        <span class="search-ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></span>
        <input id="globalSearch" type="search" placeholder="Tìm từ vựng, ngữ pháp, buổi học…" autocomplete="off">
        <kbd class="only-desktop">⌘K</kbd>
        <div id="searchResults" class="search-results" hidden></div>
      </div>

      <button id="searchBtn" class="icon-btn only-mobile" aria-label="Tìm kiếm">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></button>
      <button id="themeBtn" class="icon-btn" aria-label="Đổi giao diện sáng/tối"></button>

    <main class="content" id="content"></main>
  </div>
</div>

<div class="fab-stack">
  <a class="fab" href="#/doc/00-huong-dan-hoc.md">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.4v.4"/><circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/></svg>

    <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    <span>Lên đầu</span>
  </button>
</div>

<nav class="tabbar only-mobile">
  <a href="#/home" data-route="home">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Trang chủ</a>
  <a href="#/roadmap" data-route="roadmap">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></svg>
    Lộ trình</a>
  <button id="tabLessons">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H19v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 16.5A1.5 1.5 0 0 1 5.5 15H19"/></svg>
    Buổi học</button>
  <a href="#/flashcards" data-route="flashcards">
    <svg viewBox="0 0 24 24"><rect x="7" y="4" width="13" height="14" rx="2"/><path d="M4 7v11a2 2 0 0 0 2 2h10"/></svg>
    Flashcard</a>
  <a href="#/vocab" data-route="vocab">
    <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h13"/></svg>
    Từ vựng</a>
